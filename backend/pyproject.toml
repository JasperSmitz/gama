[project]
name = "gama"
version = "0.1.0"
description = "Self-hosted media collection manager (bulk genre editing)"
requires-python = ">=3.14"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gama.settings_test"
pythonpath = ["src", "../tools"]
testpaths = ["tests"]
# --ds outranks an exported DJANGO_SETTINGS_MODULE (the ini key above does not).
addopts = "-ra --strict-markers --ds=gama.settings_test"
markers = [
    "slow: builds or inspects real audio files with ffmpeg",
]
