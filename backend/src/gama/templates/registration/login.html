{% extends "base.html" %}
{% block title %}Log in · Gama{% endblock %}
{% block content %}
<h2>Log in</h2>
{% if form.errors %}<p role="alert">Your username and password did not match. Please try again.</p>{% endif %}
<form method="post" action="{% url 'login' %}">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Log in</button>
</form>
{% endblock %}
